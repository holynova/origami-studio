<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">纸间 Paper in Motion — 浏览器里的 3D 折纸实验室：千纸鹤、小纸船、纸飞机、蝴蝶、小青蛙</title>
  <desc id="desc">暖纸底：左上标题纸间；右侧朱砂红几何千纸鹤展翅，背景是一张带对角折痕线的正方形纸。</desc>

  <rect width="1200" height="360" rx="26" fill="#f5f3ed"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6e6350">3D 折纸实验室 · ORIGAMI STUDIO</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#2e2a24">纸间</text>
    <text x="56" y="168" font-size="23" fill="#5c5347">PAPER IN MOTION — 一张纸，折出整个世界</text>
    <text x="56" y="204" font-size="19" fill="#6e6350">逐步播放三维折叠，折痕、纸色、展开图一应俱全。</text>
    <g id="chips" font-size="18" fill="#2e2a24" text-anchor="middle">
      <g><rect x="56" y="238" width="168" height="36" rx="18" fill="#ffffff" stroke="#ddd3c0" stroke-width="1.5"/><text x="140" y="262">5 种折纸 · 75 步</text></g>
      <g><rect x="236" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd3c0" stroke-width="1.5"/><text x="299" y="262">6 种纸色</text></g>
      <g><rect x="374" y="238" width="204" height="36" rx="18" fill="#ffffff" stroke="#ddd3c0" stroke-width="1.5"/><text x="476" y="262">展开图 + PNG 导出</text></g>
      <g><rect x="590" y="238" width="138" height="36" rx="18" fill="#ffffff" stroke="#ddd3c0" stroke-width="1.5"/><text x="659" y="262">Three.js 3D</text></g>
    </g>
  </g>

  <g id="diagram">
    <g id="paper" fill="none" stroke="#c9bda6" stroke-width="2" stroke-dasharray="6 5">
      <rect x="830" y="40" width="280" height="280" rx="6" fill="#fffdf7" stroke="#d8cfba" stroke-dasharray="none"/>
      <line x1="830" y1="40" x2="1110" y2="320"/>
      <line x1="1110" y1="40" x2="830" y2="320"/>
      <line x1="970" y1="40" x2="970" y2="320"/>
      <line x1="830" y1="180" x2="1110" y2="180"/>
    </g>
    <g id="crane">
      <polygon points="970,120 830,200 920,205" fill="#c8553d"/>
      <polygon points="970,120 1110,200 1020,205" fill="#d96a4e"/>
      <polygon points="970,120 930,250 970,275 1010,250" fill="#b8482f"/>
      <polygon points="970,120 985,80 1010,95 985,125" fill="#c8553d"/>
      <polygon points="930,250 890,300 950,262" fill="#d96a4e"/>
      <polygon points="1010,250 1050,300 990,262" fill="#c8553d"/>
      <circle cx="988" cy="92" r="3" fill="#2e2a24"/>
    </g>
    <g id="crane-label" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="970" y="344" font-size="16" fill="#6e6350" text-anchor="middle">千纸鹤 · 15 步</text>
    </g>
  </g>
</svg>
